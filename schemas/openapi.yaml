openapi: 3.1.0
info:
  title: OGSystem Control Plane API
  version: 1.0.0
  description: >-
    Local-first control-plane API. Loopback mode records the server's OS account. Non-loopback
    listeners use HTTPS and the configured Basic Auth operator identity. Audit principals are
    never accepted from request bodies.
servers:
  - url: http://127.0.0.1:3337
  - url: https://{host}:3337
    variables:
      host:
        default: localhost
security:
  - basicAuth: []
x-ogs-control-plane:
  version: v1
  identityProvider: Loopback uses the local OS identity; non-loopback uses HTTPS Basic Auth from OGS_VIS_USERNAME and OGS_VIS_PASSWORD.
  anonymousPaths: [/healthz, /readyz]
  audit: Mutating run operations persist the authenticated principal with the action.
paths:
  /api/v1/workspace:
    get:
      operationId: getWorkspace
      responses:
        "200": { description: Current project workspace and readiness summary. }
        "401": { $ref: "#/components/responses/ApiError" }
  /api/v1/project:
    get:
      operationId: getProject
      responses:
        "200": { description: Current project summary. }
        "401": { $ref: "#/components/responses/ApiError" }
  /api/v1/project/design:
    get:
      operationId: getProjectDesign
      responses:
        "200": { description: Current System Design Document and revision state. }
  /api/v1/project/design/context:
    get:
      operationId: getProjectDesignContext
      responses:
        "200": { description: Canonical design, runtime observations, and context-tuning capabilities. }
        "409": { $ref: "#/components/responses/ApiError" }
  /api/v1/project/design/validate:
    post:
      operationId: validateProjectDesign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [design]
              properties:
                design: { $ref: "#/components/schemas/SystemDesignDocument" }
      responses:
        "200": { description: Design diagnostics. }
  /api/v1/project/design/apply:
    post:
      operationId: applyProjectDesignChangeSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changeSet]
              properties:
                changeSet: { $ref: "#/components/schemas/DesignChangeSet" }
      responses:
        "200": { description: Applied design and incremented revision. }
        "409": { $ref: "#/components/responses/ApiError" }
  /api/v1/project/design/import/mermaid:
    post:
      operationId: importMermaidDesign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [systemSource]
              properties:
                systemSource: { type: string, minLength: 1 }
      responses:
        "200": { description: Validated design preview. }
  /api/v1/project/design/export/mermaid:
    post:
      operationId: exportDesignMermaid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [design]
              properties:
                design: { $ref: "#/components/schemas/SystemDesignDocument" }
      responses:
        "200": { description: Deterministic Mermaid export. }
  /api/v1/project/system:
    get:
      operationId: getProjectSystem
      responses:
        "200": { description: Current system source and metadata. }
  /api/v1/project/system/validate:
    post:
      operationId: validateProjectSystem
      responses:
        "200": { description: Validation diagnostics. }
        "403": { $ref: "#/components/responses/ApiError" }
  /api/v1/project/system/save:
    post:
      operationId: saveProjectSystem
      responses:
        "200": { description: Saved system source and validation state. }
        "403": { $ref: "#/components/responses/ApiError" }
  /api/v1/runs:
    get:
      operationId: listRuns
      responses:
        "200":
          description: Indexed runs and generation time.
        "401":
          $ref: "#/components/responses/ApiError"
  /api/v1/sessions:
    get:
      operationId: listSessions
      responses:
        "200": { description: Persisted interactive Sessions for this OGS project. }
    post:
      operationId: createSession
      responses:
        "201": { description: New Session pinned to the current System and execution configuration. }
        "403": { $ref: "#/components/responses/ApiError" }
  /api/v1/sessions/{sessionId}:
    get:
      operationId: getSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Session metadata and its Turn/Run status list. }
        "404": { $ref: "#/components/responses/ApiError" }
  /api/v1/sessions/{sessionId}/turns:
    post:
      operationId: submitSessionTurn
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input: { type: string, minLength: 1 }
                dryRun: { type: boolean, default: false }
      responses:
        "202": { description: Turn accepted with a preallocated turnId and runId. }
        "400": { $ref: "#/components/responses/ApiError" }
        "409": { description: Session is stale or idempotency key was reused with different input. }
  /api/v1/sessions/{sessionId}/events:
    get:
      operationId: streamSessionEvents
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Resumable server-sent Session and Turn events.
          content:
            text/event-stream: {}
  /api/v1/runs/{runId}:
    get:
      operationId: getRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run summary, current state, and projections.
        "404":
          $ref: "#/components/responses/ApiError"
  /api/v1/runs/{runId}/events:
    get:
      operationId: getRunEvents
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: cursor
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Cursor-addressed event page.
  /api/v1/runs/{runId}/conversation:
    get:
      operationId: getRunConversation
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: cursor
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        "200":
          description: Redacted step content, handoffs, joins, and optional initial user input.
  /api/v1/runs/{runId}/stream:
    get:
      operationId: streamRunEvents
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: cursor
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Server-sent event stream with resumable event IDs.
          content:
            text/event-stream: {}
  /api/v1/runs/start:
    post:
      operationId: startRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [systemPath, input]
              properties:
                systemPath: { type: string }
                input: { type: string }
                dryRun: { type: boolean }
      responses:
        "200":
          description: Run accepted after initialization; execution continues in the background and is observable through the run APIs and event stream.
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /api/v1/runs/{runId}/resume:
    post:
      operationId: resumeRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Resume accepted after initialization; execution continues in the background and is observable through the run APIs and event stream.
        "409":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /api/v1/runs/{runId}/stop:
    post:
      operationId: stopRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Durable stop request projection.
        "403":
          $ref: "#/components/responses/ApiError"
  /api/v1/runs/{runId}/reviews/{reviewId}/decide:
    post:
      operationId: decideHumanReview
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: reviewId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { enum: [approve, rework, pause, terminate] }
                comment: { type: string, maxLength: 2000 }
                scope: { enum: [branch, run] }
      responses:
        "200":
          description: Durable review decision and reconcile state.
        "400":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        "200": { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      security: []
      responses:
        "200": { description: Local project directory is available. }
        "503": { description: Server is not ready. }
  /metrics:
    get:
      operationId: scrapeMetrics
      responses:
        "200":
          description: Prometheus text exposition for low-cardinality HTTP and event-stream metrics.
          content:
            text/plain: {}
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string }
  responses:
    ApiError:
      description: Machine-readable API error.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
                  details: {}
  schemas:
    DesignBinding:
      type: object
      required: [kind]
      properties:
        kind: { enum: [model, exec, noop] }
        modelRef: { type: string }
        profileId: { type: string }
      additionalProperties: false
    DesignSeat:
      type: object
      required: [seatId, rolePackageRef, binding]
      properties:
        seatId: { type: string }
        title: { type: string }
        responsibility: { type: string }
        rolePackageRef: { type: string }
        binding: { $ref: "#/components/schemas/DesignBinding" }
        routingMode: { enum: [parallel_split] }
        routeOrder: { type: array, items: { type: string } }
        join: { type: object }
        loop: { type: object }
        review: { type: object }
        contextMap: { type: object, additionalProperties: { type: string } }
      additionalProperties: false
    SystemDesignDocument:
      type: object
      required: [schemaVersion, revision, intent, system, seats, transitions, state, contracts, policies, bindings, presentation]
      properties:
        schemaVersion: { const: 1 }
        revision: { type: integer, minimum: 0 }
        intent: { type: object }
        system: { type: object }
        seats: { type: object, additionalProperties: { $ref: "#/components/schemas/DesignSeat" } }
        transitions: { type: array, items: { type: object } }
        state: { type: object }
        contracts: { type: array }
        policies: { type: object }
        bindings: { type: object, additionalProperties: { $ref: "#/components/schemas/DesignBinding" } }
        presentation: { type: object }
      additionalProperties: false
    DesignChangeSet:
      type: object
      required: [id, baseRevision, summary, assumptions, operations, affectedPaths, diagnostics]
      properties:
        id: { type: string }
        baseRevision: { type: integer, minimum: 0 }
        summary: { type: string }
        assumptions: { type: array }
        operations: { type: array }
        affectedPaths: { type: array, items: { type: string } }
        diagnostics: { type: array }
        confidence: { type: number, minimum: 0, maximum: 1 }
      additionalProperties: false
