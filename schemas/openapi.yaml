openapi: 3.1.0
info:
  title: OGSystem Control Plane API
  version: 1.0.0
  description: >-
    Local-first control-plane API. Mutating operations are authorized by the configured identity
    provider; the local provider records the server's OS account, while deployments may inject a
    request-authenticating provider. Audit principals are never accepted from request bodies.
servers:
  - url: http://127.0.0.1:3337
security: []
x-ogs-control-plane:
  version: v1
  identityProvider: Required for API requests; non-loopback listeners require an injected provider.
  audit: Mutating run operations persist the authenticated principal with the action.
paths:
  /api/v1/workspace:
    get:
      operationId: getWorkspace
      responses:
        "200": { description: Current project workspace and readiness summary. }
        "401": { $ref: "#/components/responses/ApiError" }
  /api/v1/project:
    get:
      operationId: getProject
      responses:
        "200": { description: Current project summary. }
        "401": { $ref: "#/components/responses/ApiError" }
  /api/v1/project/system:
    get:
      operationId: getProjectSystem
      responses:
        "200": { description: Current system source and metadata. }
  /api/v1/project/system/validate:
    post:
      operationId: validateProjectSystem
      responses:
        "200": { description: Validation diagnostics. }
        "403": { $ref: "#/components/responses/ApiError" }
  /api/v1/project/system/save:
    post:
      operationId: saveProjectSystem
      responses:
        "200": { description: Saved system source and validation state. }
        "403": { $ref: "#/components/responses/ApiError" }
  /api/v1/runs:
    get:
      operationId: listRuns
      responses:
        "200":
          description: Indexed runs and generation time.
        "401":
          $ref: "#/components/responses/ApiError"
  /api/v1/runs/{runId}:
    get:
      operationId: getRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run summary, current state, and projections.
        "404":
          $ref: "#/components/responses/ApiError"
  /api/v1/runs/{runId}/events:
    get:
      operationId: getRunEvents
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: cursor
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Cursor-addressed event page.
  /api/v1/runs/{runId}/conversation:
    get:
      operationId: getRunConversation
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: cursor
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        "200":
          description: Redacted step content, handoffs, joins, and optional initial user input.
  /api/v1/runs/{runId}/stream:
    get:
      operationId: streamRunEvents
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: cursor
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Server-sent event stream with resumable event IDs.
          content:
            text/event-stream: {}
  /api/v1/runs/start:
    post:
      operationId: startRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [systemPath, input]
              properties:
                systemPath: { type: string }
                input: { type: string }
                dryRun: { type: boolean }
      responses:
        "200":
          description: Started run projection.
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /api/v1/runs/{runId}/resume:
    post:
      operationId: resumeRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Resume result projection.
        "409":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /api/v1/runs/{runId}/stop:
    post:
      operationId: stopRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Durable stop request projection.
        "403":
          $ref: "#/components/responses/ApiError"
  /api/v1/runs/{runId}/reviews/{reviewId}/decide:
    post:
      operationId: decideHumanReview
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: reviewId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { enum: [approve, rework, pause, terminate] }
                comment: { type: string }
                scope: { enum: [branch, run] }
      responses:
        "200":
          description: Durable review decision and reconcile state.
        "409":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /healthz:
    get:
      operationId: health
      responses:
        "200": { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      responses:
        "200": { description: Local project directory is available. }
        "503": { description: Server is not ready. }
  /metrics:
    get:
      operationId: scrapeMetrics
      responses:
        "200":
          description: Prometheus text exposition for low-cardinality HTTP and event-stream metrics.
          content:
            text/plain: {}
components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string }
  responses:
    ApiError:
      description: Machine-readable API error.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
                  details: {}
