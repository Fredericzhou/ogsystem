name: CI

on:
  push:
    branches:
      - main
      - master
      - "release/**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm test
      - name: Visualizer browser smoke
        run: pnpm run test:visualizer-browser
      - name: Dry-run regressions
        run: pnpm run test:examples
      - name: Doctor preflight
        run: pnpm run test:doctor

  package-install-smoke:
    name: Package Install Smoke (${{ matrix.package_manager }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_manager:
          - npm
          - pnpm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package Install Smoke
        run: pnpm run smoke:package-install:${{ matrix.package_manager }}
