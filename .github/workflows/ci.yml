name: CI

on:
  push:
    branches:
      - main
      - master
      - "release/**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install-deps chromium
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Build
        run: pnpm run build
      - name: Detect Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          if command -v cargo >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Rust toolchain detected; Rust hello pipeline will run."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Rust toolchain unavailable; Rust hello pipeline will be skipped."
          fi
      - name: Rust hello pipeline
        if: steps.rust-toolchain.outputs.available == 'true'
        run: node --test tests/rust-hello-pipeline.test.mjs
      - name: Rust hello pipeline skipped
        if: steps.rust-toolchain.outputs.available != 'true'
        run: echo "Rust hello pipeline skipped because cargo is unavailable on this runner."
      - name: Test
        run: pnpm test
      - name: Visualizer browser smoke
        run: pnpm run test:visualizer-browser
      - name: Dry-run regressions
        run: pnpm run test:examples
      - name: Doctor preflight
        run: pnpm run test:doctor

  package-install-smoke:
    name: Package Install Smoke (${{ matrix.package_manager }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_manager:
          - npm
          - pnpm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package Install Smoke
        run: pnpm run smoke:package-install:${{ matrix.package_manager }}
