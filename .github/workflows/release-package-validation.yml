name: Release Package Validation

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to validate
        required: false
        type: string
      version:
        description: Expected package.json version for this candidate
        required: false
        type: string

jobs:
  package:
    name: Build candidate package
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify candidate version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          actual="$(node -p 'require("./package.json").version')"
          if [[ -n "$EXPECTED_VERSION" && "$actual" != "$EXPECTED_VERSION" ]]; then
            echo "Expected package version $EXPECTED_VERSION, found $actual" >&2
            exit 1
          fi
          echo "Candidate version: $actual" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare package directory
        run: mkdir -p release-candidate
      - name: Pack candidate
        run: pnpm pack --pack-destination release-candidate
      - name: Record package digest
        id: digest
        shell: bash
        run: |
          package="$(find release-candidate -maxdepth 1 -name 'ogsystem-*.tgz' -print -quit)"
          test -n "$package"
          digest="$(sha256sum "$package" | cut -d ' ' -f 1)"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "$digest  $(basename "$package")" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload candidate tarball
        uses: actions/upload-artifact@v4
        with:
          name: ogsystem-release-candidate
          path: release-candidate/*.tgz
          if-no-files-found: error

  install-matrix:
    name: Install (${{ matrix.node-version }}, ${{ matrix.os }}, ${{ matrix.package-manager }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]
        package-manager: [npm, pnpm]
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Download candidate tarball
        uses: actions/download-artifact@v4
        with:
          name: ogsystem-release-candidate
          path: release-candidate
      - name: Verify candidate tarball digest
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, readdirSync } from "node:fs";
          import { join } from "node:path";

          const packages = readdirSync("release-candidate").filter((name) => /^ogsystem-.*\.tgz$/.test(name));
          if (packages.length !== 1) throw new Error(`Expected one candidate tarball, found ${packages.length}`);
          const filename = packages[0];
          const actual = createHash("sha256").update(readFileSync(join("release-candidate", filename))).digest("hex");
          if (!process.env.EXPECTED_SHA256 || actual !== process.env.EXPECTED_SHA256) {
            throw new Error(`Candidate digest mismatch: expected ${process.env.EXPECTED_SHA256}, got ${actual}`);
          }
          console.log(`Verified ${filename} SHA-256 ${actual}`);
          NODE
      - name: Install, create project, and run from candidate tarball
        shell: bash
        run: pnpm run smoke:package-install:${{ matrix.package-manager }} -- release-candidate/ogsystem-*.tgz
